plugins {
    id 'com.android.application'
}

def activationCodeValue = "DEFAULT"
if (project.hasProperty('activationCode')) {
    activationCodeValue = project.property('activationCode')
}
if (System.getenv("ACTIVATION_CODE")) {
    activationCodeValue = System.getenv("ACTIVATION_CODE")
}

println "BUILDING WITH ACTIVATION_CODE = ${activationCodeValue}"

android {
    namespace 'com.sec.check'
    compileSdk 33

    defaultConfig {
        applicationId "com.sec.check"
        minSdk 23
        targetSdk 33
        versionCode 1
        versionName "1.0"
        buildConfigField "String", "ACTIVATION_CODE", "\"${activationCodeValue}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            buildConfigField "String", "ACTIVATION_CODE", "\"${activationCodeValue}\""
        }
        debug {
            buildConfigField "String", "ACTIVATION_CODE", "\"${activationCodeValue}\""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    configurations.all {
        resolutionStrategy {
            force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.10'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.10'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.10'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.10.1'
    implementation('androidx.appcompat:appcompat:1.6.1') {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.10'
}
