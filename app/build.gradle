plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sec.check'
    compileSdk 33

    defaultConfig {
        applicationId "com.sec.check"
        minSdk 23
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            def code = project.hasProperty('activationCode') ? project.property('activationCode') : "DEFAULT"
            buildConfigField "String", "ACTIVATION_CODE", "\"${code}\""
        }
        debug {
            def code = project.hasProperty('activationCode') ? project.property('activationCode') : "DEFAULT"
            buildConfigField "String", "ACTIVATION_CODE", "\"${code}\""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.10.1'
}
