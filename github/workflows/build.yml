name: Build Security APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Verify Project Structure
        run: |
          echo "=== Project Structure ==="
          ls -la
          echo ""
          echo "=== Gradle files ==="
          ls -la gradle/wrapper/ || echo "No wrapper folder"
          echo ""
          echo "=== App folder ==="
          ls -la app/ || echo "No app folder"

      - name: Build Release APK with system Gradle
        run: |
          gradle assembleRelease --no-daemon --stacktrace

      - name: List APK output
        run: |
          echo "=== APK Files ==="
          find app/build/outputs/apk/ -name "*.apk" -exec ls -lh {} \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: security-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: Security APK v${{ github.run_number }}
          body: |
            ## Security APK Build #${{ github.run_number }}
            
            Download the APK below and install it on the target device.
          files: app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
