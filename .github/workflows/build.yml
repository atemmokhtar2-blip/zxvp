name: Build Security APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      activation_code:
        description: 'Activation Code'
        required: false
        default: 'DEFAULT'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" "build-tools;33.0.1" > /dev/null 2>&1 || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
          cache-disabled: true

      - name: Prepare activation code
        id: prep
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            CODE="${{ github.event.inputs.activation_code }}"
          else
            CODE="DEFAULT"
          fi
          
          if [ -z "$CODE" ]; then
            CODE="DEFAULT"
          fi
          
          echo "code=$CODE" >> $GITHUB_OUTPUT
          echo "===== Using Activation Code: $CODE ====="

      - name: Build APK
        env:
          ACTIVATION_CODE: ${{ steps.prep.outputs.code }}
        run: |
          echo "Building with ACTIVATION_CODE=${ACTIVATION_CODE}"
          gradle assembleDebug \
            -PactivationCode="${ACTIVATION_CODE}" \
            -Dorg.gradle.jvmargs="-Xmx2048m" \
            --no-daemon --stacktrace

      - name: Verify BuildConfig
        run: |
          echo "===== Checking BuildConfig ====="
          find . -name "BuildConfig.java" -path "*debug*" -exec cat {} \; 2>/dev/null | head -50

      - name: Rename APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/SecurityCheck_${{ steps.prep.outputs.code }}.apk
          ls -la output/

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SecurityCheck-${{ steps.prep.outputs.code }}
          path: output/*.apk
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.run_number }}-${{ steps.prep.outputs.code }}
          name: APK ${{ steps.prep.outputs.code }}
          body: |
            ## Security APK
            Activation Code: `${{ steps.prep.outputs.code }}`
            Build: #${{ github.run_number }}
          files: output/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
