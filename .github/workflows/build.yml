name: Build Security APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      activation_code:
        description: 'Activation Code'
        required: false
        default: 'DEFAULT'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" "build-tools;33.0.1" > /dev/null 2>&1 || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
          cache-disabled: true

      - name: Set activation code
        id: set_code
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            CODE="${{ github.event.inputs.activation_code }}"
          else
            CODE="DEFAULT"
          fi
          
          if [ -z "$CODE" ]; then
            CODE="DEFAULT"
          fi
          
          echo "activation_code=$CODE" >> $GITHUB_OUTPUT
          echo "Using activation code: $CODE"

      - name: Build APK
        run: |
          gradle assembleDebug -PactivationCode="${{ steps.set_code.outputs.activation_code }}" --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/SecurityCheck_${{ steps.set_code.outputs.activation_code }}.apk
          ls -la output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SecurityCheck-${{ steps.set_code.outputs.activation_code }}
          path: output/*.apk
          retention-days: 30
